# Values that stay literal in infra/modules and infra/stacks.
# Everything else must be a variable with a default and validation (see module_literals_test.go).

# Attribute keys whose literal values are never customer settings.
keys:
  name: resource, sub-block and IAM names are owned by the module naming scheme
  description: human-readable descriptions
  sid: IAM statement ids
  effect: IAM statement effect is part of the policy document being granted
  version: IAM policy document version
  source: module sources
  backend: remote state backend kind is generated by the installer
  role_definition_name: built-in Azure RBAC roles the installer needs to operate
  error_message: precondition and check messages

# Exact `key = value` assignments allowed per module or stack directory (relative to infra/).
literals:
  modules/azure/firewall:
    - match: 'allocation_method = "Static"'
      reason: Azure Firewall requires a Standard SKU static public IP
    - match: 'sku = "Standard"'
      reason: Azure Firewall requires a Standard SKU static public IP
    - match: 'sku_name = "AZFW_VNet"'
      reason: AZFW_Hub requires a virtual_hub block; this module deploys a VNet firewall
  modules/azure/connectivity:
    - match: 'allocation_method = "Static"'
      reason: VPN and ExpressRoute gateways (non-Basic SKUs) require a Standard SKU static public IP
    - match: 'sku = "Standard"'
      reason: VPN and ExpressRoute gateways (non-Basic SKUs) require a Standard SKU static public IP
    - match: 'private_ip_address_allocation = "Dynamic"'
      reason: Dynamic is the only value virtual network gateways support (azurerm docs)
    - match: 'type = "ExpressRoute"'
      reason: gateway and connection type of the ExpressRoute resources (VPN uses azure_vpn.gateway_type)
  modules/azure/state-backend:
    - match: 'min_tls_version = "TLS1_2"'
      reason: TLS1_2 is the only value azurerm accepts for storage accounts
    - match: 'container_access_type = "private"'
      reason: remote state holds secrets and must never allow anonymous reads
  modules/azure/aks:
    - match: 'type = "SystemAssigned"'
      reason: UserAssigned needs identity_ids for identities this module does not create
  modules/azure/compute:
    - match: 'allocation_method = "Static"'
      reason: Basic public IPs are retired; VM public IPs are Standard SKU and static
    - match: 'sku = "Standard"'
      reason: Basic public IPs are retired; VM public IPs are Standard SKU and static
    - match: 'priority = 100'
      reason: the NSG holds a single rule; its priority has no effect on behaviour
    - match: 'direction = "Inbound"'
      reason: rule semantics of the SSH allow-list (bastion.allowed_ssh_cidrs is the setting)
    - match: 'access = "Allow"'
      reason: rule semantics of the SSH allow-list (bastion.allowed_ssh_cidrs is the setting)
    - match: 'protocol = "Tcp"'
      reason: SSH is TCP
    - match: 'source_port_range = "*"'
      reason: SSH clients use ephemeral source ports
    - match: 'destination_port_range = "22"'
      reason: sshd on the bastion image listens on 22
    - match: 'destination_address_prefix = "*"'
      reason: the NSG is attached to the bastion NIC only
    - match: 'disable_password_authentication = true'
      reason: the bastion is key-only; the generated key is written to <prefix>-bastion.pem
  modules/azure/bastion-host:
    - match: 'allocation_method = "Static"'
      reason: Azure Bastion requires a Standard SKU static public IP
    - match: 'sku = "Standard"'
      reason: Azure Bastion requires a Standard SKU static public IP
  modules/azure/data:
    - match: 'length = 6'
      reason: random suffix that makes storage account and registry names globally unique
    - match: 'lower = true'
      reason: storage account and registry names are lowercase alphanumeric
    - match: 'upper = false'
      reason: storage account and registry names are lowercase alphanumeric
    - match: 'special = false'
      reason: storage account and registry names are lowercase alphanumeric
    - match: 'length = 4'
      reason: random suffix that makes the Files and Foundry storage account names unique
    - match: 'create_mode = "Replica"'
      reason: the read replica resource is a replica by definition (postgresql_flexible_server.read_replica.enabled toggles it)
    - match: 'min_tls_version = "TLS1_2"'
      reason: TLS1_2 is the only value azurerm accepts for storage accounts
    - match: 'container_access_type = "private"'
      reason: corpus and backup containers hold customer data and must never allow anonymous reads
    - match: 'account_tier = "Premium"'
      reason: NFS file shares require a Premium FileStorage account
    - match: 'account_kind = "FileStorage"'
      reason: NFS file shares require a Premium FileStorage account
    - match: 'account_kind = "StorageV2"'
      reason: Azure AI Foundry requires a StorageV2 account
    - match: 'is_hns_enabled = false'
      reason: Azure AI Foundry cannot use a hierarchical-namespace account
    - match: 'registration_enabled = false'
      reason: auto-registration is for VM records; privatelink zones get records from private endpoints
  modules/azure/security:
    - match: 'rbac_authorization_enabled = false'
      reason: the legacy AI Foundry hub writes access policies during create, which RBAC vaults reject
    - match: 'type = "UserAssigned"'
      reason: the disk encryption set uses the user-assigned identity this module creates
  modules/azure/app-gateway:
    - match: 'allocation_method = "Static"'
      reason: Application Gateway v2 requires a Standard SKU static public IP
    - match: 'sku = "Standard"'
      reason: Application Gateway v2 requires a Standard SKU static public IP
    - match: 'protocol = "Http"'
      reason: the placeholder listener is HTTP; HTTPS listeners need certificates managed by AGIC
    - match: 'rule_type = "Basic"'
      reason: PathBasedRouting needs a url_path_map this module does not create
    - match: 'http_listener_name = "http"'
      reason: reference to the listener name in this module
    - match: 'frontend_ip_configuration_name = "frontend"'
      reason: reference to the frontend IP configuration name in this module
    - match: 'frontend_port_name = "http"'
      reason: reference to the frontend port name in this module
    - match: 'backend_address_pool_name = "placeholder"'
      reason: reference to the backend pool name in this module
    - match: 'backend_http_settings_name = "placeholder"'
      reason: reference to the backend settings name in this module
  modules/azure/ai-foundry:
    - match: 'type = "SystemAssigned"'
      reason: the hub identity is system-assigned; UserAssigned needs identities this module does not create
  modules/aws/vpc:
    - match: 'cidr_block = "0.0.0.0/0"'
      reason: default route of the public route table to the internet gateway
    - match: 'destination_cidr_block = "0.0.0.0/0"'
      reason: default route of the private route tables to the NAT gateway
    - match: 'domain = "vpc"'
      reason: NAT gateway EIPs must be VPC-scoped (the only non-deprecated value)
  modules/aws/naming:
    - match: 'resource_group = "rg"'
      reason: naming abbreviation (AWS CAF), part of the module naming scheme
    - match: 'vpc = "vpc"'
      reason: naming abbreviation (AWS CAF), part of the module naming scheme
    - match: 'kms = "kms"'
      reason: naming abbreviation (AWS CAF), part of the module naming scheme
    - match: 'eks = "eks"'
      reason: naming abbreviation (AWS CAF), part of the module naming scheme
    - match: 's3 = "s3"'
      reason: naming abbreviation (AWS CAF), part of the module naming scheme
  modules/aws/state-backend:
    - match: 'purpose = "terraform-state"'
      reason: tag identifying the state bucket for the installer
    - match: 'purpose = "terraform-state-lock"'
      reason: tag identifying the lock table for the installer
    - match: 'block_public_acls = true'
      reason: remote state holds secrets and must never be public
    - match: 'block_public_policy = true'
      reason: remote state holds secrets and must never be public
    - match: 'ignore_public_acls = true'
      reason: remote state holds secrets and must never be public
    - match: 'restrict_public_buckets = true'
      reason: remote state holds secrets and must never be public
    - match: 'hash_key = "LockID"'
      reason: the S3 backend requires a LockID string hash key on the lock table
    - match: 'type = "S"'
      reason: the S3 backend requires a LockID string hash key on the lock table
  modules/aws/dns-public:
    - match: 'type = "NS"'
      reason: delegation records are NS records by definition
  modules/aws/certificates:
    - match: 'validation_method = "DNS"'
      reason: the module validates certificates through its own Route 53 records; EMAIL needs manual approval
    - match: 'allow_overwrite = true'
      reason: regional and CloudFront certificates share validation records for the same names
  modules/aws/private-endpoint:
    - match: 'vpc_endpoint_type = "Interface"'
      reason: the module creates interface endpoints in a subnet; gateway endpoints live in network.gateway_endpoints
  modules/aws/data:
    - match: 'engine = "postgres"'
      reason: this resource is the PostgreSQL service
    - match: 'storage_encrypted = true'
      reason: security baseline; data at rest is always encrypted with the data-platform KMS key
    - match: 'manage_master_user_password = true'
      reason: security baseline; the admin password lives only in Secrets Manager
    - match: 'ip_protocol = "tcp"'
      reason: PostgreSQL and Redis only listen on TCP
    - match: 'length = 6'
      reason: random suffix that keeps the global S3 bucket name unique (naming scheme)
    - match: 'lower = true'
      reason: random suffix that keeps the global S3 bucket name unique (naming scheme)
    - match: 'upper = false'
      reason: S3 bucket names must be lowercase
    - match: 'special = false'
      reason: S3 bucket names allow no special characters
  modules/aws/eks:
    - match: 'from_port = 0'
      reason: all-traffic rule (protocol -1 needs ports 0) between the VPC and the cluster
    - match: 'to_port = 0'
      reason: all-traffic rule (protocol -1 needs ports 0) between the VPC and the cluster
    - match: 'protocol = "-1"'
      reason: all-traffic rule between the VPC and the cluster; egress for nodes and services
    - match: 'protocol = "tcp"'
      reason: service_security_groups ports are TCP ports
    - match: 'type = "STANDARD"'
      reason: admin principals are IAM users or roles (STANDARD access entries)
    - match: 'type = "EC2_LINUX"'
      reason: access entry type for the Linux node role
    - match: 'resource_type = "instance"'
      reason: node labels are tagged onto the EC2 instances the launch template starts
  modules/aws/karpenter-infra:
    - match: 'type = "Service"'
      reason: EventBridge is an AWS service principal
    - match: 'target_id = "karpenter"'
      reason: EventBridge target id within each rule (naming scheme)
    - match: 'type = "EC2_LINUX"'
      reason: access entry type for the Karpenter Linux node role
  modules/aws/pod-identity:
    - match: 'type = "Service"'
      reason: EKS Pod Identity is an AWS service principal
  modules/aws/bastion:
    - match: 'protocol = "tcp"'
      reason: SSH runs over TCP
    - match: 'from_port = 0'
      reason: all-traffic egress (protocol -1 needs ports 0) so SSM and package mirrors are reachable
    - match: 'to_port = 0'
      reason: all-traffic egress (protocol -1 needs ports 0) so SSM and package mirrors are reachable
    - match: 'protocol = "-1"'
      reason: all-traffic egress so SSM and package mirrors are reachable
    - match: 'domain = "vpc"'
      reason: bastion EIPs must be VPC-scoped (the only non-deprecated value)
