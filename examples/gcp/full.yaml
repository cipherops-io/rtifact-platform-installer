# Reference config: every setting the GCP schema accepts, with the default as the value.
# GCP is a preview: only features.virtual_network and features.kubernetes_cluster exist.
schema_version: 1
cloud: gcp
profile: aios-infra
tier: sandbox # GCP ships a sandbox tier preset; this file overrides it

customer:
  name: Example Corp
  code: exc

account:
  project_id: example-project
  region: us-central1

workload:
  name: aios
  name_prefix: exc-aios
  environment: sandbox

tags:
  owner: platform-team

state:
  backend: local # local | gcs
  air_gapped: true

features:
  virtual_network: true
  kubernetes_cluster: true

network:
  vnet_cidr: 10.0.0.0/20
  node_subnet_cidr: 10.0.0.0/22
  pod_cidr: 10.244.0.0/16
  service_cidr: 172.20.0.0/16

kubernetes_cluster:
  kubernetes_version: "1.30"
  availability_zones: [us-central1-a, us-central1-b, us-central1-c]
  node_pools:
    system:
      name: system
      vm_size: e2-standard-4
      node_count: 3
