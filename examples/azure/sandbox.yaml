schema_version: 1
cloud: azure
profile: aios-infra
tier: sandbox
customer:
  name: Commotion
  code: cm
account:
  subscription_id: "00000000-0000-0000-0000-000000000001"
  tenant_id: "00000000-0000-0000-0000-000000000000"
  region: centralindia
  auth:
    use_msi: false
workload:
  name: aios
  environment: sbx
  name_prefix: cm-aios-sbx
network:
  vnet_cidr: "10.1.0.0/20"
  node_subnet_cidr: "10.1.0.0/22"
  load_balancer_subnet_cidr: "10.1.4.0/24"
  private_endpoint_subnet_cidr: "10.1.5.0/24"
  management_subnet_cidr: "10.1.6.0/27"
  pod_cidr: "10.245.0.0/16"
  service_cidr: "172.21.0.0/16"
  dns_service_ip: "172.21.0.10"
state:
  backend: local
  air_gapped: true
features:
  resource_group: true
  virtual_network: true
  key_vault: true
  key_vault_private_endpoint: true
  postgresql_flexible_server: true
  container_registry: true
  storage_account: true
  redis_cache: false
  kubernetes_cluster: true
  azure_bastion: true
  private_dns_zones: true

# Bastion VM (features.azure_bastion). rtifact writes <name_prefix>-bastion.pem and prints the ssh command after apply.
#   private:       VM on the management subnet only (reach it over VPN / ExpressRoute)
#   public_ip:     VM gets a public IP; its NSG allows SSH only from allowed_ssh_cidrs
#   azure_bastion: Azure Bastion (Standard, tunneling) in front of the VM; needs network.azure_bastion_subnet_cidr /26 or larger
bastion:
  access: public_ip
  allowed_ssh_cidrs: ["203.0.113.0/24"] # replace with your office / VPN egress range

# Uncomment for a public AKS API restricted to known ranges (requires private_cluster_enabled: false).
# kubernetes_cluster:
#   api_server:
#     private_cluster_enabled: false
#     authorized_ip_ranges: ["203.0.113.0/24"]
