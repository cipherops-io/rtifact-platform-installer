# Walkthrough file: same release layout as tests/deploy/fixtures/e2e.yaml (ok-a → ok-b).
# Point registry.host and cluster at your OCI registry and kubeconfig before apply.
schema_version: 1
kind: deploy
customer:
  name: Demo
  code: demo
environment: demo
name_prefix: demo

registry:
  host: registry.example.com
  charts_path: charts
  auth:
    username_env: RTIFACT_REGISTRY_USER
    password_env: RTIFACT_REGISTRY_PASSWORD

defaults:
  timeout: 10m
  wait: true
  rollback_on_failure: true
  history_max: 5

cluster:
  kubeconfig: ./demo-kubeconfig.yaml
  expected_server: https://kubernetes.example.com

namespaces:
  - name: deploy-a
  - name: deploy-b

releases:
  - name: ok-a
    namespace: deploy-a
    chart: ok-a
    version: "1.0.0"
    crds: chart
    values:
      msg: hello
  - name: ok-b
    namespace: deploy-b
    chart: ok-b
    version: "1.0.0"
    crds: chart
    requires: [ok-a]