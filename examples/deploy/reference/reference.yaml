# Reference layout: requires chain, protect, and values_files (no fictional chart names).
# Charts must exist in your OCI registry; names here match tests/deploy/charts for local e2e.
schema_version: 1
kind: deploy
customer:
  name: Reference
  code: ref
environment: staging
name_prefix: ref-stg

registry:
  host: 127.0.0.1:5000
  charts_path: charts
  plain_http: true
  auth:
    username_env: RTIFACT_REGISTRY_USER
    password_env: RTIFACT_REGISTRY_PASSWORD

defaults:
  timeout: 15m
  wait: true
  rollback_on_failure: true
  history_max: 10

cluster:
  kubeconfig: /path/to/kubeconfig
  expected_server: https://kubernetes.example.com

namespaces:
  - name: deploy-a
  - name: deploy-b

releases:
  - name: ok-a
    namespace: deploy-a
    chart: ok-a
    version: "1.0.0"
    crds: chart
    protect: true
    values:
      msg: base
  - name: ok-b
    namespace: deploy-b
    chart: ok-b
    version: "1.0.0"
    crds: chart
    requires: [ok-a]
    values_files:
      - values-sample-app.yaml