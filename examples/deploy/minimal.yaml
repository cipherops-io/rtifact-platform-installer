schema_version: 1
kind: deploy
customer:
  name: Example
  code: example
environment: sandbox
name_prefix: example-sandbox

registry:
  host: registry.example.com
  charts_path: rtifact/charts

defaults:
  timeout: 10m
  wait: true
  rollback_on_failure: true
  history_max: 5

namespaces:
  - name: example

releases:
  - name: example-app
    namespace: example
    chart: example-chart
    version: 1.0.0
    crds: chart
