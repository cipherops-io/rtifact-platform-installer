# Change it there, then run: make boilerplate-update

name: build-binary
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag of this repository, e.g. v0.3.0"
        required: true
        type: string
      cloud:
        description: "Cloud to package"
        required: true
        type: choice
        options:
          - azure
          - aws
          - gcp
      customer:
        description: "Customer name (lowercase letters, digits, hyphens)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
    env:
      VERSION: ${{ inputs.version }}
      CLOUD: ${{ inputs.cloud }}
      CUSTOMER: ${{ inputs.customer }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Check inputs
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "version must look like v1.2.3"; exit 1; }
          [[ "$CUSTOMER" =~ ^[a-z][a-z0-9-]{1,30}$ ]] || { echo "customer: lowercase letters, digits and hyphens only"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.version }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make release PACKAGED_CLOUDS="$CLOUD" VERSION="$VERSION" CUSTOMER="$CUSTOMER" GOOS="$GOOS" GOARCH="$GOARCH"

      - name: Build summary
        run: |
          ls -lh dist/rtifact
          wc -c < dist/rtifact | xargs echo "Binary size (bytes):"

      - name: Smoke test
        if: ${{ matrix.goos == 'linux' }}
        run: |
          ./dist/rtifact version | tee version.txt
          grep -q "$VERSION" version.txt
          grep -q "$CLOUD" version.txt
          grep -q "$CUSTOMER" version.txt
          ./dist/rtifact validate --check-quota=false "examples/$CLOUD/minimal.yaml"
          ./dist/rtifact deploy validate examples/deploy/minimal.yaml
          grep -qiE 'deploy[- ]engine|helm' version.txt

      - name: Package
        run: |
          NAME="rtifact-${CUSTOMER}-${CLOUD}-${VERSION}-${GOOS}-${GOARCH}"
          mkdir -p out
          cp dist/rtifact "out/$NAME"
          (cd out && sha256sum "$NAME" > "$NAME.sha256")
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: out/
          if-no-files-found: error
          retention-days: 30

