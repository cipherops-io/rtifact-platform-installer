name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: linux
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: make build-dev GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}
      - run: shasum -a 256 dist/installer > dist/installer.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/