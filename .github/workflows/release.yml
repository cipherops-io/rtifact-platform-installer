name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: linux
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: "1.22"
      - run: make build-dev GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}
      - run: shasum -a 256 dist/rtifact > dist/rtifact.sha256
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rtifact-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/rtifact