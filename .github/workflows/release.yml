# DO NOT EDIT — managed by cipherops-io/boilerplates (rtifact-product).
# Change it there, then run: make boilerplate-update

# One build per version for all customers: one binary per cloud and platform, smoke-tested on its own
# platform, then published to the registry with an index per cloud, checksums and cosign signatures.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v0.1.0 (an existing tag unless ref is set)"
        required: true
        type: string
      ref:
        description: "Build this ref instead of the tag; only with publish false (dry run of main)"
        required: false
        default: ""
        type: string
      clouds:
        description: "Comma-separated clouds"
        required: false
        default: "azure,aws,gcp"
        type: string
      publish:
        description: "Push to the registry (false builds and smoke-tests only)"
        required: false
        default: true
        type: boolean
      replace_existing:
        description: "Overwrite exact-version tags that hold other content (v0.0.1 period only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      clouds: ${{ steps.meta.outputs.clouds }}
      matrix: ${{ steps.meta.outputs.matrix }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Check inputs
        env:
          REF: ${{ inputs.ref }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "version must look like v1.2.3 or v1.2.3-rc.1"; exit 1; }
          if [ -n "$REF" ] && [ "$PUBLISH" = true ]; then
            echo "ref builds are dry runs: set publish to false, or publish from the tag"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || format('refs/tags/{0}', inputs.version || github.ref_name) }}

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Build metadata
        id: meta
        env:
          CLOUDS: ${{ inputs.clouds || 'azure,aws,gcp' }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          clouds=$(echo "$CLOUDS" | tr -d ' ')
          known=",azure,aws,gcp,"
          for c in ${clouds//,/ }; do
            [[ "$known" == *",$c,"* ]] || { echo "unknown cloud $c"; exit 1; }
          done
          matrix=$(jq -cn --arg clouds "$clouds" --arg targets "linux/amd64,linux/arm64,darwin/arm64,darwin/amd64" '
            {include: [($clouds | split(",")[]) as $c | ($targets | split(",")[]) as $t
              | {cloud: $c, goos: ($t | split("/")[0]), goarch: ($t | split("/")[1])}]}')
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "short_sha=$(git rev-parse --short HEAD)"
            echo "clouds=$clouds"
            echo "matrix=$matrix"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

      - run: make package-content go-test
      - name: Validate examples
        run: |
          for c in $(echo "${{ steps.meta.outputs.clouds }}" | tr ',' ' '); do
            go run ./cmd/rtifact validate "examples/$c/minimal.yaml" --check-quota=false
          done
          go run ./cmd/rtifact deploy validate examples/deploy/minimal.yaml

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Provider cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/.mirror
            build/.tools
          key: providers-${{ matrix.cloud }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('build/provider-versions.yml', 'tooling.mk', 'infra/stacks/**/.terraform.lock.hcl') }}

      - name: Build
        run: make release PACKAGED_CLOUDS="${{ matrix.cloud }}" VERSION="$VERSION" GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}"

      - name: Package
        run: |
          name="rtifact-${{ matrix.cloud }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p out
          cp "dist/rtifact" "out/$name"
          (cd out && sha256sum "$name" > "$name.sha256" && cat "$name.sha256")
          ls -lh "out/$name"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.cloud }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: [verify, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/bins
          merge-multiple: true

      - name: Smoke test each cloud binary outside the repository
        shell: bash
        env:
          BINS: ${{ runner.temp }}/bins
          CLOUDS: ${{ needs.verify.outputs.clouds }}
          COMMIT: ${{ needs.verify.outputs.short_sha }}
          PLATFORM: ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          set -euo pipefail
          for c in ${CLOUDS//,/ }; do
            echo "::group::$c $PLATFORM"
            dir=$(mktemp -d)
            install -m 0755 "$BINS/rtifact-$c-${PLATFORM/\//-}" "$dir/rtifact"
            cd "$dir"
            ./rtifact version -o json | tee version.json
            jq -e --arg v "$VERSION" --arg commit "$COMMIT" --arg c "$c" --arg p "$PLATFORM" '
              .version == $v and .commit == $commit and .clouds == [$c] and .mode == "bundled"
              and .platform == $p and (.tofu_version | length > 0)' version.json >/dev/null \
              || { echo "version -o json does not match the build"; exit 1; }
            ./rtifact doctor --deep
            ./rtifact init-config write --cloud "$c" --out config.yaml
            ./rtifact validate config.yaml --check-quota=false
            ./rtifact deploy init-config --out releases.yaml
            ./rtifact deploy validate releases.yaml
            cd - >/dev/null
            rm -rf "$dir"
            echo "::endgroup::"
          done

  publish:
    needs: [verify, smoke]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDS: ${{ needs.verify.outputs.clouds }}
      REGISTRY: ${{ vars.ZOT_HOST || 'zot.prod.rtifact.ai' }}
      REGISTRY_USERNAME: ${{ vars.ZOT_USERNAME }}
      REPLACE_EXISTING: ${{ inputs.replace_existing == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: out
          merge-multiple: true

      - uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
        with:
          version: 1.4.0

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Registry login
        env:
          REGISTRY_PASSWORD: ${{ secrets.ZOT_PASSWORD }}
        run: |
          [ -n "$REGISTRY_USERNAME" ] || { echo "repository variable ZOT_USERNAME is not set"; exit 1; }
          [ -n "$REGISTRY_PASSWORD" ] || { echo "secret ZOT_PASSWORD is not set"; exit 1; }
          printf '%s' "$REGISTRY_PASSWORD" | oras login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Publish
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          SOURCE_REPO: ${{ github.server_url }}/${{ github.repository }}
          SUMMARY_FILE: ${{ runner.temp }}/registry.md
        run: |
          [ -n "$COSIGN_PRIVATE_KEY" ] && [ -n "$COSIGN_PASSWORD" ] || { echo "secrets COSIGN_PRIVATE_KEY and COSIGN_PASSWORD are required"; exit 1; }
          make publish PUBLISH_DIR=out VERSION="$VERSION" REGISTRY="$REGISTRY" \
            REGISTRY_REPOSITORY="rtifact-installer" PACKAGED_CLOUDS="$CLOUDS" \
            PUBLISH_PLATFORMS="linux/amd64,linux/arm64,darwin/arm64,darwin/amd64"
          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY_FILE: ${{ runner.temp }}/registry.md
        run: |
          assets=(out/SHA256SUMS)
          for f in build/cosign.pub scripts/install.sh; do [ -f "$f" ] && assets+=("$f"); done
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release view "$VERSION" --json body --jq .body | awk '/^## Registry artifacts/{exit} {print}' > notes.md
            cat "$SUMMARY_FILE" >> notes.md
            gh release edit "$VERSION" --notes-file notes.md
          else
            gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file "$SUMMARY_FILE"
          fi
          gh release upload "$VERSION" "${assets[@]}" --clobber
          {
            echo
            echo "Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
