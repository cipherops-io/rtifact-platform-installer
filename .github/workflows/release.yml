name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test ./...
      - name: Package content (all clouds)
        run: make package-content PACKAGED_CLOUDS=azure,aws,gcp
      - name: Validate examples
        run: |
          go run ./cmd/installer validate examples/azure/minimal.yaml
          go run ./cmd/installer validate examples/aws/minimal.yaml
          go run ./cmd/installer validate examples/gcp/minimal.yaml