# Azure E2E: workflow_dispatch with plan / validate / apply / full lifecycle / destroy.
# OIDC auth; config from examples/azure/github-e2e-azure.yaml (Commotion-shaped, isolated CIDRs).

name: azure-e2e

on:
  workflow_dispatch:
    inputs:
      rtifact_action:
        description: |
          1 validate — schema + optional quota
          2 plan — validate + OpenTofu plan
          3 apply — bootstrap, state-backend, apply stack(s)
          4 bootstrap-apply-destroy — full lifecycle then tear down workloads + tfstate
          5 destroy-all — destroy --stack all then state-backend
        required: true
        type: choice
        default: plan
        options:
          - validate
          - plan
          - apply
          - bootstrap-apply-destroy
          - destroy-all
      stack:
        description: Stack for plan/apply (destroy-all always uses all + state-backend)
        required: true
        type: choice
        default: all
        options:
          - all
          - state-backend
          - core-network
          - data-platform
          - app-platform
          - network-edge
          - ai-integrations
      check_azure:
        description: Run Azure subscription quota check on validate (--check-quota)
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  RTIFACT_ACTION: ${{ inputs.rtifact_action || 'plan' }}
  E2E_STACK: ${{ inputs.stack || 'all' }}
  CHECK_AZURE: ${{ inputs.check_azure == false && 'false' || 'true' }}

jobs:
  azure:
    runs-on: ubuntu-latest
    environment: azure-e2e
    timeout-minutes: 180
    env:
      PACKAGED_CLOUDS: azure
      INSTALLER_CONTENT_ROOT: .
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: "1.13.9"

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provider auth env (OpenTofu ARM OIDC)
        run: |
          {
            echo "ARM_USE_OIDC=true"
            echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}"
            echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}"
            echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          } >> "$GITHUB_ENV"

      - name: Prepare E2E config
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          chmod +x build/scripts/*.sh
          ./build/scripts/github-e2e-prepare-config.sh examples/azure/github-e2e-azure.yaml "$RUNNER_TEMP/e2e-config.yaml"
          echo "E2E_AZURE_CONFIG=$RUNNER_TEMP/e2e-config.yaml" >> "$GITHUB_ENV"

      - name: Build rtifact (azure only)
        run: make build-dev PACKAGED_CLOUDS=azure

      - name: rtifact validate
        if: env.RTIFACT_ACTION != 'destroy-all'
        run: ./dist/rtifact validate "$E2E_AZURE_CONFIG" --check-quota=${{ env.CHECK_AZURE }}

      - name: rtifact plan
        if: env.RTIFACT_ACTION == 'plan'
        run: ./dist/rtifact plan "$E2E_AZURE_CONFIG" --stack "${{ env.E2E_STACK }}" --yes

      # Idempotent: no-ops when remote tfstate storage already exists (e.g. manual E2E setup).
      - name: rtifact bootstrap
        if: env.RTIFACT_ACTION == 'apply' || env.RTIFACT_ACTION == 'bootstrap-apply-destroy'
        run: ./dist/rtifact bootstrap "$E2E_AZURE_CONFIG" --yes

      - name: rtifact apply
        if: env.RTIFACT_ACTION == 'apply' || env.RTIFACT_ACTION == 'bootstrap-apply-destroy'
        run: ./dist/rtifact apply "$E2E_AZURE_CONFIG" --stack "${{ env.E2E_STACK }}" --yes

      - name: rtifact destroy workloads
        if: env.RTIFACT_ACTION == 'destroy-all' || env.RTIFACT_ACTION == 'bootstrap-apply-destroy'
        run: ./dist/rtifact destroy "$E2E_AZURE_CONFIG" --stack all --yes --allow-destroy-stateful

      - name: rtifact destroy state-backend
        if: env.RTIFACT_ACTION == 'destroy-all' || env.RTIFACT_ACTION == 'bootstrap-apply-destroy'
        run: ./dist/rtifact destroy "$E2E_AZURE_CONFIG" --stack state-backend --yes