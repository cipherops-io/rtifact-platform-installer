# DO NOT EDIT — managed by cipherops-io/boilerplates (rtifact-product).
# Change it there, then run: make boilerplate-update
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-managed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout boilerplates (defaults var-files)
        shell: bash
        run: |
          set -e
          want=$(grep '^BOILERPLATES_REF ?=' boilerplate.mk | head -1 | awk '{print $3}')
          for ref in "$want" refactor/skeleton-only-v3 v3.0.0; do
            if git clone --depth 1 -b "$ref" \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/cipherops-io/boilerplates.git" \
              boilerplates-src 2>/dev/null; then
              echo "Checked out boilerplates @ $ref"
              exit 0
            fi
          done
          echo "boilerplates checkout failed" >&2
          exit 1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install boilerplate CLI
        run: |
          make install-boilerplate-cli
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Verify managed files
        shell: bash
        run: |
          export BOILERPLATES_REPO="${GITHUB_WORKSPACE}/boilerplates-src"
          tpl_ref=$(git -C boilerplates-src describe --tags --exact-match 2>/dev/null || git -C boilerplates-src branch --show-current)
          export BOILERPLATES_TEMPLATE_URL="github.com/cipherops-io/boilerplates//devops-templates/rtifact-product?ref=${tpl_ref}"
          make check-template-source boilerplate-verify
  config-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: make package-content
      - run: go test ./tests/config/...
  tofu-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install boilerplate CLI
        run: |
          make install-boilerplate-cli
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Install OpenTofu
        run: |
          v=$(make -s print-tool-versions | sed -n 's/^TOFU_VERSION=//p' | head -1)
          curl -fsSL "https://get.opentofu.org/install-opentofu.sh" | bash -s -- --install-method standalone --opentofu-version "$v"
          echo "/usr/local/bin" >> "${GITHUB_PATH}"
      - name: Install terraform-docs
        run: |
          v=$(make -s print-tool-versions | sed -n 's/^TERRAFORM_DOCS_VERSION=//p' | head -1)
          curl -sSL "https://github.com/terraform-docs/terraform-docs/releases/download/v${v}/terraform-docs-v${v}-linux-amd64.tar.gz" | tar -xz -C "${RUNNER_TEMP}"
          sudo mv "${RUNNER_TEMP}/terraform-docs" /usr/local/bin/terraform-docs
      - run: chmod +x build/scripts/*.sh 2>/dev/null || true
      - run: make package-content tofu-fmt-check check-tools go-test
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: make package-content go-test go-vet