# DO NOT EDIT — managed by cipherops-io/boilerplates (rtifact-product).
# Change it there, then run: make boilerplate-update
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-managed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install boilerplate CLI
        run: |
          make install-boilerplate-cli
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Verify managed files
        shell: bash
        run: |
          set -e
          want=$(grep '^BOILERPLATES_REF ?=' boilerplate.mk | head -1 | awk '{print $3}')
          for ref in "$want" v3.0.0 refactor/skeleton-only-v3; do
            export BOILERPLATES_REF="$ref"
            export BOILERPLATES_TEMPLATE_URL="github.com/cipherops-io/boilerplates//devops-templates/rtifact-product?ref=${ref}"
            export BOILERPLATES_REPO=/nonexistent
            if make check-template-source boilerplate-update; then
              git diff --exit-code -- . ':(exclude)boilerplate-manifest.yaml'
              echo "verify-managed OK (boilerplates ref=${ref})"
              exit 0
            fi
          done
          echo "boilerplate-verify failed for all template refs" >&2
          exit 1
  config-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: make package-content
      - run: go test ./tests/config/...
  tofu-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install boilerplate CLI
        run: |
          make install-boilerplate-cli
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Install OpenTofu
        run: |
          v=$(make -s print-tool-versions | sed -n 's/^TOFU_VERSION=//p' | head -1)
          curl -fsSL "https://get.opentofu.org/install-opentofu.sh" | bash -s -- --install-method standalone --opentofu-version "$v"
          echo "/usr/local/bin" >> "${GITHUB_PATH}"
      - name: Install terraform-docs
        run: |
          v=$(make -s print-tool-versions | sed -n 's/^TERRAFORM_DOCS_VERSION=//p' | head -1)
          curl -sSL "https://github.com/terraform-docs/terraform-docs/releases/download/v${v}/terraform-docs-v${v}-linux-amd64.tar.gz" | tar -xz -C "${RUNNER_TEMP}"
          sudo mv "${RUNNER_TEMP}/terraform-docs" /usr/local/bin/terraform-docs
      - run: chmod +x build/scripts/*.sh 2>/dev/null || true
      - run: make package-content tofu-fmt-check check-tools go-test
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: make package-content go-test go-vet