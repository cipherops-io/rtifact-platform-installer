name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: "1.22"
      - uses: opentofu/setup-opentofu@v2.0.2
      - run: make build-dev test validate-examples tofu-validate
  # Live Azure deploy E2E is workflow_dispatch only: .github/workflows/azure-e2e.yml