name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: "1.22"
      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: "1.13.9"
      - name: Install terraform-docs
        env:
          TD_VERSION: "0.20.0"
        run: |
          curl -sSL "https://github.com/terraform-docs/terraform-docs/releases/download/v${TD_VERSION}/terraform-docs-v${TD_VERSION}-linux-amd64.tar.gz" | tar -xz -C "${RUNNER_TEMP}"
          sudo mv "${RUNNER_TEMP}/terraform-docs" /usr/local/bin/terraform-docs
          terraform-docs version
      - run: make tofu-test-fast
      - if: github.ref == 'refs/heads/main'
        run: make tofu-test
  # Live Azure deploy E2E is workflow_dispatch only: .github/workflows/azure-e2e.yml