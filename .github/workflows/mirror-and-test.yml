name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: "1.22"
      - run: go mod download
      - run: chmod +x build/scripts/*.sh && make package-content
      - run: go test ./...
      - run: make build-dev
      - run: INSTALLER_CONTENT_ROOT=. ./dist/rtifact validate examples/sandbox.yaml --check-azure=false
      - run: INSTALLER_CONTENT_ROOT=. ./dist/rtifact aws validate examples/aws.yaml --check-quota=false
      - run: INSTALLER_CONTENT_ROOT=. ./dist/rtifact gcp validate examples/gcp.yaml --check-quota=false

  release-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        packaged_clouds:
          - azure,aws,gcp
          - azure
          - aws
          - gcp
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: "1.22"
      - run: chmod +x build/scripts/*.sh
      - run: make build-dev PACKAGED_CLOUDS=${{ matrix.packaged_clouds }}
      - run: ./dist/rtifact version

  tofu-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        packaged_clouds: [azure,aws,gcp, azure, aws, gcp]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: "1.13.9"
      - run: tofu fmt -recursive -check infra/
      - run: make tofu-validate PACKAGED_CLOUDS=${{ matrix.packaged_clouds }}