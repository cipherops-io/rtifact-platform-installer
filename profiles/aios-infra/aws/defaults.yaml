features:
  network: false
  bastion: false
  kubernetes_cluster: false
  karpenter: false
  public_dns: false
  certificates: false
  kms: false
  postgresql: false
  redis: false
  object_storage: false
  container_registry: false

network:
  nat_gateway: single
  gateway_endpoints: [s3, dynamodb]
  flow_logs: false

bastion:
  access: ssm
  public_ip: false

public_dns:
  delegated: false

certificates:
  key_algorithm: RSA_2048
  cloudfront: false

kms:
  deletion_window_days: 30

postgresql:
  engine_version: "16"
  instance_class: db.t4g.medium
  allocated_storage_gb: 100
  max_allocated_storage_gb: 500
  multi_az: false
  backup_retention_days: 7
  deletion_protection: true
  subnet_tier: datastore

redis:
  engine_version: "7.1"
  node_type: cache.t4g.small
  num_cache_clusters: 1
  subnet_tier: datastore

object_storage:
  versioning: true

container_registry:
  image_tag_mutability: IMMUTABLE
  scan_on_push: true

state:
  backend: s3
  air_gapped: false
  versioning: true
  encryption: AES256

kubernetes_cluster:
  node_role_policies:
    - AmazonEKSWorkerNodePolicy
    - AmazonEKS_CNI_Policy
    - AmazonEC2ContainerRegistryReadOnly
  node_groups:
    initial:
      instance_types: [m6a.large]
      capacity_type: ON_DEMAND
      ami_type: AL2023_x86_64_STANDARD
      min_size: 1
      desired_size: 2
      max_size: 3
      max_unavailable: 1
      subnet_tier: node
      disk:
        size_gb: 100
        type: gp3
        encrypted: true
      metadata:
        http_tokens: optional
        hop_limit: 2
  service_security_groups:
    internal:
      ports: [80, 443]
      cidrs: [vpc]
    public:
      ports: [80, 443]
      cidrs: [0.0.0.0/0]