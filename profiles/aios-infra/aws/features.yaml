features:
  network:
    status: stable
    requires: []
    description: VPC, subnets, NAT, gateway endpoints
  bastion:
    status: stable
    requires: [network]
    description: Jump host (SSM or SSH)
  kubernetes_cluster:
    status: stable
    requires: [network]
    description: EKS cluster, node groups, add-ons
  karpenter:
    status: stable
    requires: [kubernetes_cluster]
    description: Karpenter AWS infrastructure (IAM, SQS, Pod Identity)
  pod_identities:
    status: preview
    requires: [kubernetes_cluster]
    description: EKS Pod Identity roles for in-cluster controllers (external-dns, cert-manager, etc.)
  public_dns:
    status: stable
    requires: []
    description: Public Route53 zone
  certificates:
    status: stable
    requires: [public_dns]
    description: ACM certificates (regional and us-east-1)
  kms:
    status: preview
    requires: []
    description: Customer-managed KMS key encrypting the data services below
  postgresql:
    status: preview
    requires: [network]
    description: RDS for PostgreSQL in a private subnet tier; master password managed in Secrets Manager
  redis:
    status: preview
    requires: [network]
    description: ElastiCache for Redis replication group with TLS and at-rest encryption
  object_storage:
    status: preview
    requires: []
    description: S3 bucket (versioned, encrypted, public access blocked)
  container_registry:
    status: preview
    requires: []
    description: ECR repository (immutable tags, scan on push)