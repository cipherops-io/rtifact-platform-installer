features:
  resource_group:
    status: stable
    requires: []
    description: Workload resource group
  virtual_network:
    status: stable
    requires: [resource_group]
  key_vault:
    status: stable
    requires: [resource_group]
  key_vault_private_endpoint:
    status: stable
    requires: [key_vault, virtual_network, private_dns_zones]
  postgresql_flexible_server:
    status: stable
    requires: [virtual_network]
  container_registry:
    status: stable
    requires: [virtual_network]
  storage_account:
    status: stable
    requires: [virtual_network]
  redis_cache:
    status: stable
    requires: [virtual_network]
    description: Azure Cache for Redis Premium (private endpoint)
  azure_managed_redis:
    status: stable
    requires: [virtual_network, private_dns_zones]
    description: Azure Managed Redis (Balanced SKUs) with private endpoint; mutually exclusive with redis_cache
  azure_files_share:
    status: stable
    requires: [virtual_network, private_dns_zones]
    description: Premium Azure Files share (NFS) with private endpoint
  communication_email:
    status: stable
    requires: [resource_group]
    description: Azure Communication + Email Communication services (domain verification remains manual)
  mongodb_atlas:
    status: unsupported
    reason: Atlas M30 project, peering or Private Link — configure outside rtifact (see checklist)
  ai_foundry:
    status: stable
    requires: [key_vault, storage_account]
    description: Microsoft Foundry Hub (azurerm_ai_foundry); model deployments remain manual
  kubernetes_cluster:
    status: stable
    requires: [virtual_network]
  azure_bastion:
    status: stable
    requires: [virtual_network]
    description: Jump access — managed Azure Bastion (bastion.managed true) or Linux VM (false)
  private_dns_zones:
    status: stable
    requires: [resource_group]
  azure_firewall:
    status: stable
    requires: [virtual_network, resource_group]
  azure_vpn_gateway:
    status: stable
    requires: [virtual_network]
    description: Route-based VPN gateway; mutually exclusive with azure_express_route_gateway
  azure_express_route_gateway:
    status: stable
    requires: [virtual_network]
    description: ExpressRoute virtual network gateway; mutually exclusive with azure_vpn_gateway
  private_dns_resolver:
    status: stable
    requires: [virtual_network, private_dns_zones]
  public_dns_zone:
    status: stable
    requires: [resource_group]
  application_gateway:
    status: stable
    requires: [virtual_network]
  disk_encryption_set:
    status: stable
    requires: [key_vault]