features:
  resource_group: false
  virtual_network: false
  key_vault: false
  key_vault_private_endpoint: false
  postgresql_flexible_server: false
  container_registry: false
  storage_account: false
  redis_cache: false
  azure_files_share: false
  communication_email: false
  kubernetes_cluster: false
  azure_bastion: false
  private_dns_zones: false
  azure_firewall: false
  azure_vpn_gateway: false
  azure_express_route_gateway: false
  private_dns_resolver: false
  public_dns_zone: false
  application_gateway: false
  disk_encryption_set: false
  azure_managed_redis: false
  ai_foundry: false

network:
  vnet_cidr: "10.0.0.0/20"
  node_subnet_cidr: "10.0.0.0/22"
  load_balancer_subnet_cidr: "10.0.4.0/24"
  private_endpoint_subnet_cidr: "10.0.5.0/24"
  management_subnet_cidr: "10.0.6.0/27"
  pod_cidr: "10.244.0.0/16"
  service_cidr: "172.20.0.0/16"
  dns_service_ip: "172.20.0.10"

kubernetes_cluster:
  kubernetes_version: "1.30"
  availability_zones: ["1", "2", "3"]
  node_pools:
    user_microservices:
      name: appa
      vm_size: Standard_D16s_v5
      node_count: 3
    user_sandbox:
      name: sandbox
      vm_size: Standard_F8s_v2
      node_count: 2
    user_monitoring:
      name: monitor
      vm_size: Standard_D8s_v5
      node_count: 2
    user_jupyter:
      name: jupyter
      vm_size: Standard_D32s_v5
      node_count: 2
    user_database:
      name: database
      vm_size: Standard_E8s_v5
      node_count: 3
    system:
      name: system
      vm_size: Standard_D4s_v5
      node_count: 3

bastion:
  managed: false
  vm_size: Standard_D4s_v5
  os_disk_size_gb: 100
  os_disk_type: Premium_LRS

azure_bastion:
  vm_size: Standard_D4s_v5
  os_disk_size_gb: 100


redis_cache:
  sku_name: Premium
  family: P
  capacity: 1
  minimum_tls_version: "1.2"

azure_files:
  share_name: aios-shared
  quota_gb: 1024
  zone_redundant: true

postgresql_flexible_server:
  sku_name: GP_Standard_D8ds_v5
  version: "16"
  storage_mb: 1048576
  iops: 40000
  high_availability:
    enabled: true
    mode: ZoneRedundant
  read_replica:
    enabled: true
  backup_retention_days: 7

storage_account:
  corpus_gb: 250
  backup_gb: 250

container_registry:
  sku: Premium

key_vault:
  sku: premium
  foundry:
    soft_delete_retention_days: 7
    purge_protection_enabled: true
    grant_deployer_contributor: true
    deployer_key_permissions:
      - Backup
      - Create
      - Delete
      - Get
      - Import
      - List
      - Purge
      - Recover
      - Restore
      - Update
      - GetRotationPolicy
      - SetRotationPolicy
      - Rotate
    deployer_secret_permissions:
      - Backup
      - Delete
      - Get
      - List
      - Purge
      - Recover
      - Restore
      - Set
    deployer_certificate_permissions:
      - Create
      - Delete
      - Get
      - Import
      - List
      - ManageContacts
      - ManageIssuers
      - SetIssuers
      - Update

ai_foundry:
  public_network_access: Disabled
  storage:
    account_tier: Standard
    account_replication_type: LRS
    public_network_access: Disabled